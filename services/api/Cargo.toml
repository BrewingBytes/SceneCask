[workspace]
members = ["."]
resolver = "3"

[package]
name = "scenecask-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tracing-test = { version = "=0.2.6", features = ["no-env-filter"] }
