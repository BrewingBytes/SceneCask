openapi: 3.1.0
info:
  title: SceneCask API
  version: 1.0.0
  description: "Canonical C03–C08 REST contract. Same-origin /api/v1, cookie sessions, server
    privacy/spoiler filtering. Success JSON unwrapped. Unknown mutation keys rejected; provider
    payloads never returned. Auth and personalized data use Cache-Control: private, no-store. Error
    messages never contain protected strings, asset paths, configuration or secrets. C03 provides
    rate/body limits and per-field provenance. Reveal never bypasses privacy or changes progress.
    Runtime integration is owned by R24/R38."
servers:
  - url: /api/v1
    description: Configured same-origin reverse proxy; credentials remain server-side.
tags:
  - name: Auth
    description: Auth operations; canonical C03–C08.
  - name: Profile
    description: Profile operations; canonical C03–C08.
  - name: Account
    description: Account operations; canonical C03–C08.
  - name: Catalog
    description: Catalog operations; canonical C03–C08.
  - name: Library
    description: Library operations; canonical C03–C08.
  - name: Tracking
    description: Tracking operations; canonical C03–C08.
  - name: Social
    description: Social operations; canonical C03–C08.
  - name: Discussions
    description: Discussions operations; canonical C03–C08.
  - name: Spoilers
    description: Spoilers operations; canonical C03–C08.
  - name: Notifications
    description: Notifications operations; canonical C03–C08.
  - name: Moderation
    description: Moderation operations; canonical C03–C08.
security:
  - SessionCookie: []
paths:
  /session:
    get:
      operationId: getSession
      summary: Get session
      description: 'GET /session (public): 200 `{user:null,csrfToken:"..."}` or
        `{user:{id,email,displayName,handle,visibility,verified:true,role:"member"},csrfToken:"..."}`.
        Anonymous CSRF cookie is not an authenticated session.'
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/6
      responses:
        "200":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Set-Cookie:
              $ref: "#/components/headers/Set-Cookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                success:
                  value:
                    user: null
                    csrfToken: synthetic-csrf-token
                authenticated:
                  value:
                    user:
                      id: 10000000-0000-4000-8000-000000000001
                      email: ana@example.test
                      displayName: Ana
                      handle: ana_r
                      visibility: private
                      verified: true
                      role: member
                    csrfToken: synthetic-csrf-token
        "400":
          $ref: "#/components/responses/Error4001"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      x-rebuild-owner: R06
  /auth/register:
    post:
      operationId: register
      summary: Register
      description: >-
        POST /auth/register `{email,password}` → 202 `{message:"Check your email."}` for new or
        existing email; queue verification only for eligible unverified registration. Password
        12–128 characters, no arbitrary composition rule; never trim password. Normalize email
        trim+casefold, no plus/dot rewriting. Pending users cannot access libraries. Existing
        verified accounts unchanged.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/9
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                success:
                  value:
                    message: Check your email.
        "400":
          $ref: "#/components/responses/Error4001"
        "403":
          $ref: "#/components/responses/Error4035"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              request:
                value:
                  email: ana@example.test
                  password: xxxxxxxxxxxx
      x-rebuild-owner: R07
  /auth/verify:
    post:
      operationId: verifyEmail
      summary: Verify email
      description: >-
        POST /auth/verify `{token}` → 200 session DTO and rotated cookie; single-use token valid
        24h; expired/replayed → 410 with resend action.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/9
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Set-Cookie:
              $ref: "#/components/headers/Set-Cookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
              examples:
                success:
                  value:
                    user:
                      id: 10000000-0000-4000-8000-000000000001
                      email: ana@example.test
                      displayName: Ana
                      handle: ana_r
                      visibility: private
                      verified: true
                      role: member
                    csrfToken: synthetic-csrf-token
        "400":
          $ref: "#/components/responses/Error4001"
        "403":
          $ref: "#/components/responses/Error4035"
        "410":
          $ref: "#/components/responses/Error4106"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              request:
                value:
                  token: x
      x-rebuild-owner: R07
  /auth/verification-resend:
    post:
      operationId: resendVerification
      summary: Resend verification
      description: >-
        POST /auth/verification-resend `{email}` → 202 same generic message; invalidate previous
        verification token, 60-second resend cooldown.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/9
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                success:
                  value:
                    message: Check your email.
        "400":
          $ref: "#/components/responses/Error4001"
        "403":
          $ref: "#/components/responses/Error4035"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            examples:
              request:
                value:
                  email: ana@example.test
      x-rebuild-owner: R07
  /auth/login:
    post:
      operationId: login
      summary: Login
      description: >-
        POST /auth/login `{email,password}` → 200 session DTO or generic 401 INVALID_CREDENTIALS;
        unverified correct credentials → 403 EMAIL_UNVERIFIED and verification screen, no
        application session. Argon2id password hashing; offload expensive work from async executor.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/13
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Set-Cookie:
              $ref: "#/components/headers/Set-Cookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
              examples:
                success:
                  value:
                    user:
                      id: 10000000-0000-4000-8000-000000000001
                      email: ana@example.test
                      displayName: Ana
                      handle: ana_r
                      visibility: private
                      verified: true
                      role: member
                    csrfToken: synthetic-csrf-token
        "400":
          $ref: "#/components/responses/Error4001"
        "401":
          $ref: "#/components/responses/Error4017"
        "403":
          $ref: "#/components/responses/Error4038"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              request:
                value:
                  email: ana@example.test
                  password: x
      x-rebuild-owner: R08
  /auth/password-reset-request:
    post:
      operationId: requestPasswordReset
      summary: Request password reset
      description: >-
        POST /auth/password-reset-request `{email}` → 202 generic check-email message; reset token
        expires 30m, single use.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/13
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                success:
                  value:
                    message: Check your email.
        "400":
          $ref: "#/components/responses/Error4001"
        "403":
          $ref: "#/components/responses/Error4035"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            examples:
              request:
                value:
                  email: ana@example.test
      x-rebuild-owner: R08
  /auth/password-reset:
    post:
      operationId: resetPassword
      summary: Reset password
      description: >-
        POST /auth/password-reset `{token,newPassword}` → 204; invalidate all sessions/grants and
        prior tokens; requires fresh login. Expired/replayed → 410. An SSO-only verified user may
        establish a password by proving mailbox control here.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/13
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Successful response. No response body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
        "400":
          $ref: "#/components/responses/Error4001"
        "403":
          $ref: "#/components/responses/Error4035"
        "410":
          $ref: "#/components/responses/Error4106"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
            examples:
              request:
                value:
                  token: x
                  newPassword: xxxxxxxxxxxx
      x-rebuild-owner: R08
  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      description: >-
        Authenticated requests require CSRF; already logged-out returns 204. Revoke session and
        reveal grants, expire cookie.


        POST /auth/logout `{}` → 204, revoke session+grants, expire cookie. Already logged out also
        204.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/6
      parameters:
        - $ref: "#/components/parameters/Origin"
        - name: X-CSRF-Token
          in: header
          required: false
          schema:
            type: string
            minLength: 1
          description: Required when an authenticated session exists; logged-out logout is204.
      responses:
        "204":
          description: Successful response. No response body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Set-Cookie:
              $ref: "#/components/headers/Set-Cookie"
        "400":
          $ref: "#/components/responses/Error4001"
        "403":
          $ref: "#/components/responses/Error4035"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
            examples:
              request:
                value: {}
      x-rebuild-owner: R06
  /auth/google/start:
    get:
      operationId: startGoogleAuth
      summary: Start google auth
      description: >-
        Signin is public; link and reauth require current session. Link requires fresh
        reauthentication. Allowlisted same-origin returnTo only; single-use state/nonce/PKCE expires
        after 10m.


        GET /auth/google/start?intent=signin|link|reauth&returnTo=/home (signin public) → 303 Google
        authorization URL. Store single-use state/nonce/PKCE and intent, lifetime 10m. ReturnTo
        allowlisted same-origin path only.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/15
      parameters:
        - name: intent
          in: query
          required: true
          schema:
            type: string
            enum:
              - signin
              - link
              - reauth
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?!.*%(?:0[0-9A-Fa-f]|1[0-9A-Fa-f]|20|7[Ff]|2[Ff]|5[Cc]|25))/(?![/\\])[\x21-\x5B\x5D-\x7E]*(?![\s\S])
            default: /home
          description: Decoded query value must be an allowlisted same-origin path. Reject controls,
            whitespace, backslashes, protocol-relative paths and encoded controls/separators/percent
            signs. Decode the query once, never decode returnTo again; resolve against the
            configured public origin and verify its origin before redirecting. This pattern is a
            syntax guard, not the route allowlist.
      responses:
        "303":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Location:
              schema:
                type: string
                format: uri-reference
              description: Google authorization URL for start; allowlisted same-origin application path for
                callback. No response body.
              example: https://accounts.google.com/o/oauth2/v2/auth
        "400":
          $ref: "#/components/responses/Error4001"
        "401":
          $ref: "#/components/responses/Error4019"
        "403":
          $ref: "#/components/responses/Error4035"
        "409":
          $ref: "#/components/responses/Error40910"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      x-rebuild-owner: R09
  /auth/google/callback:
    get:
      operationId: completeGoogleAuth
      summary: Complete google auth
      description: >-
        code required on success; error=access_denied on cancellation. Validate OIDC
        state/nonce/PKCE, issuer, audience, expiry, signature; never merge by email or retain Google
        refresh tokens. Safe same-origin redirect to home/onboarding or recoverable auth error.


        GET /auth/google/callback?code=...&state=... (public) → 303 /home, /onboarding/profile or
        account/signin error route. Validate state, PKCE, nonce, issuer, audience, expiry and
        signature through a maintained OIDC library and discovery/JWKS. Scopes openid email profile
        only; no Google API access/refresh token retention. Require verified email for new account.
        Subject identifies account, never mutable email. Matching existing email with unknown
        subject → link-required UI, not auto-merge. Link requires current authenticated account and
        fresh reauthentication. Cancellation returns recoverable UI and no session. Reauth intent
        must match current account identity.
      tags:
        - Auth
      security: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/15
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: error
          in: query
          required: false
          schema:
            type: string
            enum:
              - access_denied
      responses:
        "303":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Set-Cookie:
              $ref: "#/components/headers/Set-Cookie"
            Location:
              schema:
                type: string
                format: uri-reference
              description: Google authorization URL for start; allowlisted same-origin application path for
                callback. No response body.
              example: /home
        "400":
          $ref: "#/components/responses/Error4001"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      x-rebuild-owner: R09
  /auth/reauth:
    post:
      operationId: reauthenticate
      summary: Reauthenticate
      description: >-
        POST /auth/reauth `{password}` → 204 marks current session reauthenticated now; invalid →
        generic 401. Google-only users use Google reauth intent. Freshness 5m for
        link/unlink/delete.


        Requires authenticated cookie session.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security:
        - SessionCookie: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/13
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Successful response. No response body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
        "400":
          $ref: "#/components/responses/Error4001"
        "401":
          $ref: "#/components/responses/Error40111"
        "403":
          $ref: "#/components/responses/Error4035"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      x-email-verified: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
            examples:
              request:
                value:
                  password: x
      x-rebuild-owner: R08
  /me/identities:
    get:
      operationId: getIdentities
      summary: Get identities
      description: >-
        GET /me/identities → 200 `{passwordEnabled:true,googleLinked:false}`. DELETE
        /me/identities/google → 204 with fresh reauth; 409 if last sign-in method. Does not delete
        account.


        Requires authenticated cookie session.
      tags:
        - Auth
      security:
        - SessionCookie: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/15
      responses:
        "200":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identities"
              examples:
                success:
                  value:
                    passwordEnabled: false
                    googleLinked: false
        "400":
          $ref: "#/components/responses/Error4001"
        "401":
          $ref: "#/components/responses/Error4019"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      x-email-verified: false
      x-rebuild-owner: R09
  /me/identities/google:
    delete:
      operationId: unlinkGoogle
      summary: Unlink google
      description: >-
        Fresh reauthentication within 5m required; never remove last usable sign-in method.


        Requires authenticated cookie session.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.
      tags:
        - Auth
      security:
        - SessionCookie: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/15
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Successful response. No response body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
        "400":
          $ref: "#/components/responses/Error4001"
        "401":
          $ref: "#/components/responses/Error4019"
        "403":
          $ref: "#/components/responses/Error4035"
        "409":
          $ref: "#/components/responses/Error40912"
        "422":
          $ref: "#/components/responses/Error4222"
        "429":
          $ref: "#/components/responses/Error4293"
        "503":
          $ref: "#/components/responses/Error5034"
      x-email-verified: false
      x-rebuild-owner: R09
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
            examples:
              request:
                value: {}
  /me:
    patch:
      operationId: updateProfile
      summary: Update profile
      description: >-
        PATCH /me `{displayName:"Ana",handle:"ana_r"}` → 200 user DTO. Name 1–80 chars, handle 3–30
        lowercase ASCII letters/digits/underscore, unique (409 HANDLE_TAKEN). Handle immutable after
        first choice in initial scope; subsequent different handle 422. No user-controlled operator
        role. Email change/avatar uploads out of scope; initials avatars.


        Requires authenticated cookie session.


        Same-origin validation required. Authenticated mutations require session-paired
        X-CSRF-Token; body uses application/json. Errors never echo credentials, submitted content,
        protected strings or asset paths.


        Personal profile endpoint requires verified email.
      tags:
        - Profile
      security:
        - SessionCookie: []
      x-issue: https://github.com/BrewingBytes/SceneCask/issues/12
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Successful response. Unwrapped authoritative payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                success:
                  value:
                    id: 10000000-0000-4000-8000-000000000001
                    email: ana@example.test
                    displayName: Ana
                    handle: ana_r
                    visibility: private
                    verified: true
