  headers:
    Cache-Control:
      schema:
        type: string
        enum:
          - private, no-store
      description: Viewer responses must not enter shared caches or share ETags.
    Set-Cookie:
      schema:
        type: string
      description: __Host-scenecask; Secure; HttpOnly; SameSite=Lax; Path=/. Opaque ID hash stored
        server-side, rotate on authentication, idle7d/absolute30d. Logout expires cookie and grants.
        Localhost development may use non-Secure scenecask cookie; never deploy the exception.
        Anonymous CSRF cookie is not an authenticated session.
    Retry-After:
      schema:
        type: string
        pattern: ^[0-9]+$
      description: Seconds until retry; auth5/min/IP+identifier20/hour, writes60/min/user,
        search30/min/user, comment10/min/user. Configurable defaults.
      example: "60"
