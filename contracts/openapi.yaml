components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-scenecask
      description: Opaque server-managed cookie. Secure,HttpOnly,SameSite=Lax,Path=/; idle7d/absolute30d.
        Rotated on authentication; resets/logout/deletion revoke sessions and reveal grants. See C04
        for localhost exception. Mutations additionally require Origin and X-CSRF-Token.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Opaque validated keyset cursor; malformed cursor400. Never a numeric offset.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      description: Default20, max50; episode listing defaults50.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Paired to session bootstrap token. Same-origin Origin validation and application/json
        required.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Retained24h per user. Same key/body returns stored outcome; changed body409. Retry
        unknown outcomes with the same key.
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Must match configured public origin; auth requests also validate Origin. Browsers
        supply this forbidden request header automatically; SSR clients must configure the public
        origin. Never rely on a script-set browser Origin value.
  schemas:
    Visibility:
      type: string
      enum:
        - private
        - public
      example: private
    LibraryStatus:
      type: string
      enum:
        - plan_to_watch
        - watching
        - on_hold
        - dropped
      example: plan_to_watch
    Access:
      type: string
      enum:
        - locked
        - watched
        - revealed
      example: locked
    RevealScope:
      type: string
      enum:
        - episode_details
        - discussion
      example: episode_details
    ReportReason:
      type: string
      enum:
        - later_episode
        - abuse
