name: scenecask
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: scenecask
      POSTGRES_PASSWORD: scenecask_local
      POSTGRES_DB: scenecask
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenecask -d scenecask"]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.31.4
    ports: ["127.0.0.1:10259:1025", "127.0.0.1:8029:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
