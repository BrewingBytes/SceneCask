name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: scenecask
          POSTGRES_PASSWORD: scenecask_ci
          POSTGRES_DB: scenecask
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scenecask -d scenecask"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mail:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      DATABASE_URL: postgres://scenecask:scenecask_ci@127.0.0.1:5432/scenecask
      API_BIND: 127.0.0.1:8080
      API_ORIGIN: http://127.0.0.1:8080
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: yarn
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/api
      - run: yarn install --immutable
      - run: yarn test:design
        if: ${{ hashFiles('apps/web/src/styles/generate-tokens.mjs') != '' }}
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn api:check
      - run: yarn test
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - run: yarn test:ui
        if: ${{ hashFiles('apps/web/src/components/ui/basic/playwright.config.ts') != '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
